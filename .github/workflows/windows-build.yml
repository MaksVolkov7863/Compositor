name: Build Windows Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: windows
        run: |
          npm install

      - name: Run Windows Test Suite
        working-directory: windows
        run: |
          npm test

      - name: Build Windows Executable & Installer
        working-directory: windows
        run: |
          npm run dist

      - name: Upload Windows Binaries Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows-x64
          path: |
            windows/dist/*.exe
            windows/dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}
          name: Compositor for Windows ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}
          body: |
            ## Compositor for Windows v1.1.0
            
            The lightweight, focused Photoshop alternative for Windows 10/11 — updated with recent upstream innovations!
            
            ### What's New in v1.1.0:
            - **Inner Glow Layer FX**: Full choke, size, color picker, opacity, and source (edge/center) settings.
            - **Image Auto-Trim**: Automatically crop out transparent borders or canvas edges (`Image > Trim...`).
            - **Camera Raw Filter**: Comprehensive color temperature, tint, exposure (+/- stops), highlights, shadows, and vibrance (`Filter > Camera Raw Filter...` / `Ctrl+Shift+A`).
            - **Motion Blur Filter**: Directional angle and distance blurring (`Filter > Blur > Motion Blur...`).
            - **Co-scaled Film Grain**: Noise grain scale dynamically couples with canvas resolution.
            - **Brush Smoothing & Middle-Click Pan**: Smooth stroke interpolation and seamless middle-mouse canvas panning.
            - **Layer Groups Hierarchy**: Organize layers into nested folders with recursive visibility and cascading opacity.
            - **DistortWarp Geometry**: Free transform quadrilateral homography and perspective mapping.
            - **Parity Tracking & Schema Guard**: Automated CI parity checker (`npm run parity`) and JSON Schema manifest validation.
            
            ### Downloads
            - **Compositor Setup (Installer)**: Download `Compositor Setup 1.1.0.exe` below
            - **Compositor Portable**: Download `Compositor 1.1.0.exe` below (no installation required)
          files: |
            windows/dist/*.exe
            windows/dist/*.zip
          draft: false
          prerelease: false

