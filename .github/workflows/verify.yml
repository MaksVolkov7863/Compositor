name: Verify

on:
  push:
    paths:
      - 'Compositor/**'
      - 'CompositorTests/**'
      - 'CompositorUITests/**'
      - 'Compositor.xcodeproj/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'Compositor/**'
      - 'CompositorTests/**'
      - 'CompositorUITests/**'
      - 'Compositor.xcodeproj/**'
      - 'scripts/**'

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    # Push covers same-repo branches. pull_request runs only for forks, so a PR is not tested twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Run unit tests
        run: >
          xcodebuild test
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS'
          -configuration Debug
          -derivedDataPath DerivedData
          -resultBundlePath TestResults.xcresult
          -parallel-testing-enabled NO
          -skip-testing:CompositorUITests
          CODE_SIGN_IDENTITY=-

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  ui:
    name: ui
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Run UI tests
        run: >
          xcodebuild test
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS'
          -configuration Debug
          -derivedDataPath DerivedData
          -resultBundlePath TestResults.xcresult
          -parallel-testing-enabled NO
          -only-testing:CompositorUITests
          CODE_SIGN_IDENTITY=-

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
